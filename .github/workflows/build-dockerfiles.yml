name: Build Dockerfiles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # CI matrix rows use the existing local moodle-ci-base image, not this
      # legacy per-branch GHCR builder (whose docker/Dockerfile is absent here).
      - 'docker/**'

jobs:
  build-matrix:
    runs-on: [self-hosted, hetzner]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (for YAML parsing)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: |
          python -m venv "$RUNNER_TEMP/matrix-python"
          "$RUNNER_TEMP/matrix-python/bin/pip" install pyyaml
          echo "$RUNNER_TEMP/matrix-python/bin" >> "$GITHUB_PATH"

      - name: Extract unique moodle-branch/php matrix
        id: set-matrix
        run: |
          import yaml
          import json
          with open('.github/actions/matrix/matrix_includes.yml') as f:
              data = yaml.safe_load(f)
          pairs = set((row['moodle-branch'], row['php']) for row in data['include'])

          def container_name(branch, php):
              name = f"catalyst-moodle-workflows-{branch}-{php}"
              name = name.replace('_', '-').lower()
              return f"ghcr.io/catalyst/{name}:latest"

          def find_node(branch, php):
              for row in data['include']:
                  if row['moodle-branch'] == branch and row['php'] == php:
                      return row.get('node', 20)
              return 20

          matrix = [
              {
                  'moodle-branch': b,
                  'php': p,
                  'node': find_node(b, p),
                  'container': container_name(b, p)
              }
              for b, p in sorted(pairs)
          ]
          print('::set-output name=matrix::' + json.dumps(matrix))
        shell: python

  build:
    name: ${{ matrix.container }}
    needs: build-matrix
    runs-on: [self-hosted, hetzner]
    env:
      # Do not share login/logout state with another job on the Docker host.
      DOCKER_CONFIG: ${{ runner.temp }}/moodle-docker-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      matrix:
        include: ${{fromJson(needs.build-matrix.outputs.matrix)}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          flock -n -E 75 /tmp/fleet-heavy.lock docker build \
            --build-arg MOODLE_BRANCH=${{ matrix.moodle-branch }} \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            -t ${{ matrix.container }} \
            -f docker/Dockerfile docker/

      - name: Push Docker image to GHCR
        run: docker push ${{ matrix.container }}
